<meta charset="utf-8">
<link rel="stylesheet" type="text/css" href="llm-plugin_styles.css">
<!-- No Font Awesome CDN: the Node-RED editor bundles Font Awesome 4.7, so we
     only use fa-* icons that exist in 4.7 and everything works offline. -->
<!-- marked.js is served from the plugin's own npm dependency so Markdown
     rendering keeps working on offline installs (no CDN). -->
<script src="llm-plugin/vendor/marked.js" charset="utf-8"></script>

<script src="llm-plugin/src/client.js" charset="utf-8"></script>

<!-- Sidebar DOM. Injected by vibe_ui.js (createLLMPluginUI); kept here so
     markup lives in HTML, not JS strings. -->
<script type="text/html" id="llm-plugin-sidebar-template">
    <div class="llm-plugin-header">
        <h3 class="llm-plugin-title">LLM Plugin Chat</h3>
        <div class="header-buttons">
            <button class="header-btn" data-action="new-chat">New Chat</button>
            <button class="header-btn" data-action="chat-list">Chats</button>
            <button class="header-btn" data-action="restore-points" title="Restore points">
                <i class="fa fa-history" aria-hidden="true"></i>
            </button>
            <button class="header-btn" id="llm-plugin-settings-button"><i class="fa fa-cog"></i></button>
        </div>
    </div>
    <div class="llm-plugin-chat" id="llm-plugin-chat"></div>
    <div class="llm-plugin-input">
        <details class="llm-session-config" open>
            <summary style="font-size: 12px; cursor: pointer; color: #666; margin-bottom: 8px; font-weight: bold;">Session Options</summary>
            <div class="flow-selector" id="llm-plugin-flow-selector">
                <button type="button" class="flow-selector-toggle" id="llm-plugin-flow-toggle" aria-haspopup="listbox" aria-expanded="false">
                    <span class="flow-selector-label" id="llm-plugin-flow-label">Current Open Flow</span>
                    <i class="fa fa-caret-down flow-selector-caret" aria-hidden="true"></i>
                </button>
                <div class="flow-selector-panel" id="llm-plugin-flow-panel" role="listbox"></div>
            </div>
            <div class="agent-mode-row">
                <label for="llm-plugin-mode">Mode</label>
                <select id="llm-plugin-mode" class="mode-select">
                    <option value="ask" selected>Ask</option>
                    <option value="agent">Agent</option>
                </select>
            </div>
            <input type="text" id="llm-plugin-model" class="model-input" placeholder="Model (e.g., llama3.2:latest)" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        </details>
        <div class="prompt-input-group">
            <textarea id="llm-plugin-prompt" class="prompt-input" placeholder="Ask something or request a flow..."></textarea>
            <button id="llm-plugin-generate" class="generate-btn">Send</button>
        </div>
    </div>
    <div id="llm-plugin-settings-overlay" class="llm-settings-overlay" role="dialog" aria-modal="true" aria-hidden="true">
        <div id="llm-plugin-settings-dialog" class="llm-settings-dialog"></div>
    </div>
</script>

<!-- Per-message controls, cloned by ui_core.js (cloneTemplate) for every
     assistant message. Here rather than as JS strings for the same reason
     the sidebar itself is: this is markup, and it reads as markup. Only the
     fixed shapes live here — which controls a message gets, and what the
     Import button does with the parsed reply, stay in JS because they are
     decisions, not layout. -->
<script type="text/html" id="llm-plugin-message-actions-template">
    <div class="message-actions">
        <!-- fa-refresh, not fa-redo: the editor bundles Font Awesome 4.7
             (offline) and fa-redo only exists in FA 5. -->
        <button class="retry-btn" title="Retry message">
            <i class="fa fa-refresh" aria-hidden="true"></i>
        </button>
    </div>
</script>

<script type="text/html" id="llm-plugin-flow-actions-template">
    <div class="flow-actions">
        <button class="import-btn">Import Flow</button>
    </div>
</script>

<!-- Sits ABOVE the message: it rewinds to before this reply was applied. -->
<script type="text/html" id="llm-plugin-pre-chat-actions-template">
    <div class="flow-actions pre-chat-actions"></div>
</script>

<script type="text/html" id="llm-plugin-restore-btn-template">
    <button class="restore-btn">Restore Checkpoint</button>
</script>

<!-- Restore-point browser. Chat checkpoints are reachable from the message
     that holds their id; the Agent node's are not attached to any message,
     so this is how they are found at all. Same classes as the chat list so
     it looks like part of the sidebar rather than a second dialect. -->
<script type="text/html" id="llm-plugin-checkpoint-modal-template">
    <div class="chat-modal">
        <div class="chat-modal-content">
            <div class="modal-header">
                <h3>Restore Points</h3>
                <button class="close-btn" title="Close">&times;</button>
            </div>
            <div class="checkpoint-filter">
                <label><input type="radio" name="cp-source" value="" checked> All</label>
                <label><input type="radio" name="cp-source" value="pre-import"> Chat</label>
                <label><input type="radio" name="cp-source" value="node-apply"> Node</label>
            </div>
            <div class="chat-list checkpoint-list"></div>
        </div>
    </div>
</script>

<script type="text/html" id="llm-plugin-checkpoint-item-template">
    <div class="chat-item">
        <div class="chat-info">
            <div class="chat-title">
                <span class="checkpoint-source"></span>
                <span class="checkpoint-what"></span>
            </div>
            <div class="chat-date"></div>
            <div class="message-count"></div>
        </div>
        <div class="chat-actions">
            <button class="restore-btn">Restore</button>
        </div>
    </div>
</script>

<script type="text/html" id="llm-plugin-settings-template" data-template-name="llm-plugin-settings-template">
    <div class="form-row">
        <label for="llm-provider"><i class="fa fa-cogs"></i> LLM Provider</label>
        <select id="llm-provider">
            <option value="ollama">Ollama</option>
            <option value="openai">OpenAI</option>
            <option value="custom">Custom (OpenAI-compatible)</option>
        </select>
    </div>

    <div id="ollama-settings">
        <div class="form-row">
            <label for="ollama-url"><i class="fa fa-globe"></i> Ollama URL</label>
            <input type="text" id="ollama-url" placeholder="http://localhost:11434">
        </div>
    </div>

    <div id="openai-settings" style="display: none;">
        <div class="form-row">
            <label for="openai-api-key"><i class="fa fa-key"></i> OpenAI API Key</label>
            <input type="password" id="openai-api-key" placeholder="sk-..." autocomplete="off">
        </div>
        <div class="form-tips" style="font-size: 12px; color: #666; margin-top: 5px;">
            <i class="fa fa-info-circle"></i> API Key is stored AES-256-GCM encrypted in <code>&lt;userDir&gt;/llm-plugin/credentials.json</code>, under a key this plugin generates for itself, and is <strong>NOT</strong> included in flow exports.
        </div>
    </div>

    <div id="custom-settings" style="display: none;">
        <div class="form-row">
            <label for="custom-base-url"><i class="fa fa-globe"></i> Base URL</label>
            <input type="text" id="custom-base-url" placeholder="http://localhost:8080/v1">
        </div>
        <div class="form-row">
            <label for="custom-api-key"><i class="fa fa-key"></i> API Key (optional)</label>
            <input type="password" id="custom-api-key" placeholder="leave blank if not required" autocomplete="off">
        </div>
        <div class="form-tips" style="font-size: 12px; color: #666; margin-top: 5px;">
            <i class="fa fa-info-circle"></i> For OpenAI-compatible endpoints (llama.cpp, LM Studio, vLLM, LocalAI, etc.). The Base URL is the full chat-completions root (e.g. <code>http://localhost:8080/v1</code>). API Key may be left blank for endpoints that don't require authentication.
        </div>
    </div>

    <div class="form-row" style="margin-top: 12px;">
        <label for="llm-system-prompt"><i class="fa fa-comment-o"></i> System Prompt</label>
        <textarea id="llm-system-prompt" rows="6" style="width: 100%; font-family: monospace; font-size: 12px; resize: vertical;" placeholder="Additional instructions for the LLM..."></textarea>
        <div class="form-tips" style="font-size: 12px; color: #666; margin-top: 5px;">
            <i class="fa fa-info-circle"></i> This text is prepended to the built-in system prompt for every request. Use it to give the LLM persistent instructions (e.g. preferred node types, coding style, language).
        </div>
        <button type="button" id="llm-system-prompt-reset" style="margin-top: 4px; font-size: 11px; padding: 2px 8px;">Reset to default</button>
    </div>

    <div class="form-row" style="margin-top: 12px;">
        <label for="llm-max-prompt-length"><i class="fa fa-text-width"></i> Max Prompt Length</label>
        <input type="number" id="llm-max-prompt-length" min="100" max="100000" step="100" value="10000" style="width: 120px;">
        <span style="font-size: 12px; color: #666; margin-left: 6px;">characters</span>
        <div class="form-tips" style="font-size: 12px; color: #666; margin-top: 5px;">
            <i class="fa fa-info-circle"></i> Maximum character length for prompts sent to the LLM. Range: 100 - 100,000. Default: 10,000.
        </div>
    </div>

    <div class="llm-settings-actions">
        <button type="button" id="llm-plugin-settings-cancel" class="llm-settings-btn secondary">Cancel</button>
        <button type="button" id="llm-plugin-settings-save" class="llm-settings-btn primary">Save</button>
    </div>
</script>
