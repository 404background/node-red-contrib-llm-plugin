<script type="text/javascript">
    RED.nodes.registerType('llm-request', {
        category: 'llm-plugin',
        color: '#ffd700',
        defaults: {
            name:         { value: '' },
            provider:     { value: 'ollama' },
            model:        { value: '', required: true },
            systemPrompt: { value: '' },
            // Seconds, 0 = no limit. Long by default: local LLMs are slow.
            timeout:      { value: 3600, validate: function(v) {
                return v === '' || v === undefined || (!isNaN(v) && Number(v) >= 0);
            } }
        },
        inputs: 1,
        outputs: 1,
        icon: 'font-awesome/fa-comments',
        paletteLabel: 'llm-request',
        label: function() {
            return this.name || this.model || 'llm-request';
        }
    });
</script>

<script type="text/html" data-template-name="llm-request">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="LLM">
    </div>
    <div class="form-row">
        <label for="node-input-provider"><i class="fa fa-server"></i> Provider</label>
        <select id="node-input-provider">
            <option value="ollama">Ollama</option>
            <option value="openai">OpenAI</option>
            <option value="custom">Custom</option>
        </select>
    </div>
    <div class="form-row">
        <label for="node-input-model"><i class="fa fa-microchip"></i> Model</label>
        <input type="text" id="node-input-model" placeholder="e.g. llama3.1 / gpt-5-mini">
    </div>
    <div class="form-row">
        <label for="node-input-systemPrompt" style="vertical-align:top;"><i class="fa fa-file-text-o"></i> System</label>
        <textarea id="node-input-systemPrompt" rows="4" style="width:70%;" placeholder="(optional) instructions for every request"></textarea>
    </div>
    <div class="form-row">
        <label for="node-input-timeout"><i class="fa fa-clock-o"></i> Timeout</label>
        <input type="number" id="node-input-timeout" min="0" step="1" placeholder="3600" style="width:120px;"> seconds (0 = no limit)
    </div>
    <div class="form-tips">
        <i class="fa fa-info-circle"></i> API keys & provider URLs come from the LLM Plugin sidebar.
    </div>
</script>

<script type="text/html" data-help-name="llm-request">
    <p>Sends <code>msg.payload</code> to an LLM and outputs the reply. API keys
    and provider URLs come from the <b>LLM Plugin sidebar</b> (Settings).</p>

    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">string | object</span></dt><dd>The prompt. Objects are JSON-stringified.</dd>
        <dt class="optional">system <span class="property-type">string</span></dt><dd>Overrides the node's system prompt.</dd>
        <dt class="optional">model <span class="property-type">string</span></dt><dd>Overrides the configured model.</dd>
        <dt class="optional">timeout <span class="property-type">number</span></dt><dd>Overrides the timeout, in seconds (0 = no limit).</dd>
    </dl>

    <h3>Outputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">string</span></dt><dd>The reply text.</dd>
        <dt>llm <span class="property-type">object</span></dt><dd>provider, model, elapsed ms.</dd>
    </dl>

    <p>Every message is one LLM request — mind the trigger rate. Details on GitHub:
    <a href="https://github.com/404background/node-red-contrib-llm-plugin/blob/main/docs/en/llm-request.md" target="_blank" rel="noopener">llm-request node</a>
    (<a href="https://github.com/404background/node-red-contrib-llm-plugin/blob/main/docs/jp/llm-request.md" target="_blank" rel="noopener">日本語</a>).</p>
</script>
