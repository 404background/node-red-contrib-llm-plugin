<script type="text/javascript">
    RED.nodes.registerType('llm-request', {
        category: 'llm-plugin',
        color: '#ffd700',
        defaults: {
            name:        { value: '' },
            mode:        { value: 'ask' },
            provider:    { value: 'ollama' },
            model:       { value: '', required: true },
            targetFlows: { value: [] },
            // Admin API base; blank = auto-detect.
            editorUrl:   { value: '' },
            editorUrlType: { value: 'str' },
            autoDeploy:  { value: false },
            // Seconds, 0 = no limit. Long by default: local LLMs are slow.
            timeout:     { value: 3600, validate: function(v) {
                return v === '' || v === undefined || (!isNaN(v) && Number(v) >= 0);
            } }
        },
        inputs: 1,
        outputs: 1,
        icon: 'font-awesome/fa-comments',
        paletteLabel: 'llm-request',
        label: function() {
            return this.name || ('llm-request (' + (this.mode === 'agent' ? 'agent' : 'ask') + ')');
        },
        oneditprepare: function() {
            $('#node-input-editorUrl').typedInput({
                default: 'str',
                types: ['str', 'flow', 'global'],
                typeField: '#node-input-editorUrlType'
            });

            // Refreshed on every open: the tab list changes underneath.
            var sel = $('#node-input-targetFlows').empty();
            RED.nodes.eachWorkspace(function(ws) {
                sel.append($('<option>').val(ws.id).text(ws.label || ws.id));
            });
            sel.val(Array.isArray(this.targetFlows) ? this.targetFlows : []);

            function syncMode() {
                $('.llm-request-agent-only').toggle($('#node-input-mode').val() === 'agent');
            }
            $('#node-input-mode').on('change', syncMode);
            syncMode();
        },
        oneditsave: function() {
            this.targetFlows = $('#node-input-targetFlows').val() || [];
        }
    });
</script>

<script type="text/javascript">
    // Agent mode's editor half: applies what the runtime publishes over comms.
    // Bound once per session. See docs/{en,jp}/llm-request.md.
    (function () {
        if (typeof RED === 'undefined' || !RED.comms || typeof RED.comms.subscribe !== 'function') return;
        if (window.__llmPluginAgentApplyBound) return;
        window.__llmPluginAgentApplyBound = true;

        function notify(text, type) { if (RED.notify) RED.notify(text, type || 'info'); }

        // Reached only after applyAgentResult's LLMPlugin check.
        function flowNames(ids) {
            return (window.LLMPlugin.Common.flowLabels(ids)) || 'the flow';
        }

        function applyAgentResult(payload) {
            var ids = Array.isArray(payload.targetFlows) ? payload.targetFlows : [];
            var P = window.LLMPlugin;
            if (!P || !P.Importer || typeof P.Importer.importFlowFromMessage !== 'function' ||
                !P.ApplyQueue || typeof P.ApplyQueue.enqueue !== 'function') {
                notify('llm-request node: the LLM Plugin is still loading in this editor (or not installed) — wait a moment and retry.', 'warning');
                return;
            }
            // One target: show it, so the edit lands in view.
            if (ids.length === 1 && RED.workspaces && typeof RED.workspaces.show === 'function') {
                try { RED.workspaces.show(ids[0]); } catch (e) { /* tab may be gone */ }
            }
            // Through the apply queue: a reply can land while the user is
            // reviewing an undeployed edit. See docs/{en,jp}/design.md §13.
            P.ApplyQueue.enqueue({
                source: 'node',
                label: 'llm-request node' + (payload.nodeName ? ' (' + payload.nodeName + ')' : ''),
                targetFlowIds: ids,
                apply: function () {
                // Undo for a node-driven edit, taken inside the turn so it
                // snapshots what this edit merges against. A failed save is
                // reported, not fatal.
                var cpPromise = (P.ChatManager && typeof P.ChatManager.saveNodeApplyCheckpoint === 'function')
                    ? P.ChatManager.saveNodeApplyCheckpoint(
                        { id: payload.nodeId, name: payload.nodeName }, ids)
                    : Promise.resolve(null);

                return cpPromise.then(function (checkpointId) {
                    return P.Importer.importFlowFromMessage(payload.response, {
                        mode: 'agent',
                        // The flows sent to the model are the only ones it may
                        // write to. Empty = no context was sent.
                        allowedWorkspaceIds: ids
                    })
                    .then(function (result) {
                        if (result && result.ok) {
                            var applied = 'llm-request node applied changes to ' + flowNames(ids);
                            if (!checkpointId) {
                                applied += ' (no restore point could be saved)';
                            }
                            if (!payload.autoDeploy) {
                                notify(applied + '. Review and Deploy.', 'success');
                            } else if (RED.actions && typeof RED.actions.invoke === 'function') {
                                // The editor's own Deploy, async; `true` is
                                // save()'s skipValidation flag, so an unattended
                                // loop cannot stall on a confirm dialog.
                                try {
                                    RED.actions.invoke('core:deploy-flows', true);
                                    notify(applied + '. Deploy triggered (auto deploy) — watch the deploy result notification.', 'success');
                                } catch (e) {
                                    notify(applied + ', but auto deploy failed to start: ' + (e && e.message ? e.message : e), 'warning');
                                }
                            } else {
                                notify(applied + ', but this editor does not support auto deploy — deploy manually.', 'warning');
                            }
                        } else if (result && result.error) {
                            notify('llm-request node: ' + result.error, 'warning');
                        }
                        // The queue reads `ok` to decide whether to hold.
                        return result;
                    });
                });
                }
            })
                .catch(function (e) {
                    notify('llm-request node import error: ' + (e && e.message ? e.message : e), 'error');
                });
        }

        RED.comms.subscribe('llm-plugin/agent-apply', function (topic, payload) {
            try { if (payload && typeof payload.response === 'string') applyAgentResult(payload); }
            catch (e) { if (window.console) console.error('[llm-request] agent-apply failed', e); }
        });
    })();
</script>

<script type="text/html" data-template-name="llm-request">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="LLM">
    </div>
    <div class="form-row">
        <label for="node-input-mode"><i class="fa fa-cogs"></i> Mode</label>
        <select id="node-input-mode">
            <option value="ask">Ask</option>
            <option value="agent">Agent</option>
        </select>
    </div>
    <div class="form-row">
        <label for="node-input-provider"><i class="fa fa-server"></i> Provider</label>
        <select id="node-input-provider">
            <option value="ollama">Ollama</option>
            <option value="openai">OpenAI</option>
            <option value="custom">Custom</option>
        </select>
    </div>
    <div class="form-row">
        <label for="node-input-model"><i class="fa fa-microchip"></i> Model</label>
        <input type="text" id="node-input-model" placeholder="e.g. llama3.1 / gpt-4o-mini">
    </div>
    <div class="form-row">
        <label for="node-input-targetFlows" style="vertical-align:top;"><i class="fa fa-sitemap"></i> Flows</label>
        <select id="node-input-targetFlows" multiple size="4" style="width:70%;"></select>
    </div>
    <div class="form-row">
        <label for="node-input-editorUrl"><i class="fa fa-link"></i> API URL</label>
        <input type="text" id="node-input-editorUrl" style="width:70%;" placeholder="http://localhost:1880">
        <input type="hidden" id="node-input-editorUrlType">
    </div>
    <div class="form-row">
        <label for="node-input-timeout"><i class="fa fa-clock-o"></i> Timeout</label>
        <input type="number" id="node-input-timeout" min="0" step="1" placeholder="3600" style="width:120px;"> seconds (0 = no limit)
    </div>
    <div class="form-row llm-request-agent-only">
        <label for="node-input-autoDeploy"><i class="fa fa-upload"></i> Auto deploy</label>
        <input type="checkbox" id="node-input-autoDeploy" style="display:inline-block; width:auto; vertical-align:middle;">
        <span style="font-size:12px;">deploy right after applying</span>
    </div>
    <div class="form-tips">
        <i class="fa fa-info-circle"></i> API keys & provider URLs come from the LLM Plugin sidebar. Selected flows are sent as context. API URL: blank = auto-detect (recommended).
    </div>
    <div class="form-tips llm-request-agent-only" style="margin-top:6px;">
        <i class="fa fa-exclamation-triangle"></i> Agent edits the open editor live (no chat history; a restore point is saved before each edit). <b>Auto deploy</b> deploys immediately without confirmation — development only; keep one editor open, use the Modified Nodes/Flows deploy type. Generated flows may contain <code>function</code>/<code>exec</code> nodes, so never feed untrusted input into an Agent node.
    </div>
</script>

<script type="text/html" data-help-name="llm-request">
    <p>Sends <code>msg.payload</code> to an LLM and outputs the reply. Provider,
    model and the selected flows are configured on the <code>llm-request</code>
    node; the provider's API key and URLs come from the <b>LLM Plugin sidebar</b>
    (Settings).</p>

    <h3>Modes</h3>
    <dl class="message-properties">
        <dt>Ask</dt><dd>Returns the model's text reply on <code>msg.payload</code>. The selected flows (if any) are sent as context.</dd>
        <dt>Agent</dt><dd>Same, then applies the proposed changes <b>live in the open editor</b> using the same importer as the sidebar (add / edit / delete). Review on the canvas and <b>Deploy</b> — or enable <b>Auto deploy</b> to skip the review. An editor must be open.</dd>
    </dl>

    <h3>Flows</h3>
    <p>Pick none, one, or several flows to send to the LLM as context. The list
    refreshes when you open the node. In Agent mode the changes are applied to
    the selected flow(s); the reply is still on <code>msg.payload</code>.</p>

    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">string | object</span></dt><dd>The prompt. Strings are newline-normalised; objects are JSON-stringified.</dd>
        <dt class="optional">model <span class="property-type">string</span></dt><dd>Overrides the configured model.</dd>
        <dt class="optional">editorUrl <span class="property-type">string</span></dt><dd>Overrides the API URL used to read flow context.</dd>
        <dt class="optional">timeout <span class="property-type">number</span></dt><dd>Overrides the configured timeout, in seconds (0 = no limit).</dd>
    </dl>

    <h3>Outputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">string</span></dt><dd>The model's text reply (natural language — do not <code>JSON.parse</code> it).</dd>
        <dt>llm <span class="property-type">object</span></dt><dd>mode, provider, model, elapsed ms.</dd>
        <dt>flow <span class="property-type">object</span> (Agent)</dt><dd><code>{ targetFlows, dispatchedToEditor, autoDeploy }</code>. <code>autoDeploy</code> reflects the node setting (intent), not whether the editor's deploy succeeded.</dd>
    </dl>

    <h3>Status</h3>
    <p>While a request is running the node shows a blue dot with the elapsed
    time; on success a green <code>done (…)</code> (Ask) or
    <code>sent to editor</code> (Agent); on failure a red
    <code>error</code> or <code>timeout</code>.</p>

    <h3>Notes</h3>
    <ul>
        <li><b>Timeout</b> defaults to 3600&nbsp;seconds (local LLMs can be slow). 0 = no limit; <code>msg.timeout</code> overrides.</li>
        <li><b>Auto deploy (developer feature):</b> deploys right after applying, asynchronously and <b>without any confirmation dialog</b> (node-validation warnings are skipped). Development only. Keep one editor open (every open editor deploys) and prefer the Modified Nodes/Flows deploy type — a Full deploy restarts the flow driving this node.</li>
        <li><b>Agent runs what the model writes:</b> the reply is applied with no review step and there is no node-type restriction, so a generated flow may contain <code>function</code> nodes (arbitrary JavaScript in this process) or <code>exec</code> nodes (arbitrary shell commands). Whoever controls the model output controls this host. Use a trusted endpoint, and do <b>not</b> wire untrusted text (<code>http in</code> payloads, inbound messages, scraped content) into an <code>llm-request</code> node in Agent mode — with Auto deploy that is remote input straight to code execution.</li>
        <li><b>Applies are queued, not raced.</b> If a flow this node targets has an edit already applied and not yet deployed — yours from the sidebar, or an earlier reply from another <code>llm-request</code> node — this one waits for that deploy instead of merging on top of an uncommitted change. Edits to different flows never wait for each other. With <b>Auto deploy</b> on, the node releases its own hold; without it, the wait ends when you deploy. The sidebar shows what is waiting and why.</li>
        <li><b>Agent needs an open editor</b> with the LLM Plugin loaded; the reply is applied there via comms. It is not recorded in chat history, but a Restore Checkpoint of the target flows is saved immediately before each edit, so the change can be rolled back. Those checkpoints belong to no chat (they are tagged <code>node-apply</code>) and are kept to their own limit, so a node firing on a timer cannot crowd out the sidebar's restore points. If the checkpoint cannot be saved the edit still applies and the notification says so.</li>
        <li><b>API URL</b> is the Node-RED admin API base — normally the same URL the editor is served at (standalone: <code>http://localhost:1880</code>; embedded: the <code>httpAdminRoot</code> base, e.g. <code>http://localhost:8000/red</code>). Blank = auto-detect from the running instance (recommended). Accepts a string or a flow/global context variable; <code>msg.editorUrl</code> overrides. If the configured URL fails, the node falls back to auto-detection with a warning.</li>
        <li><b>Mind the trigger rate:</b> every message costs one LLM request (and one canvas edit in Agent mode).</li>
    </ul>
</script>
